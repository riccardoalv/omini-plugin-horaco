id: horaco
name: Horaco switch
version: 0.3.0
protocol: 1
entrypoint: main.py
timeout_s: 90
description: >-
  Horaco HC-SWTGW218AS and other managed switches with the same web interface
  (keepLink, Sodola and similar Realtek-based OEM models): ports with link
  speed, counters, MAC table, 802.1Q VLANs, model, firmware and uptime; enables
  and disables ports, sets their VLANs and creates VLANs (applied, checked,
  then saved on the switch); backs up its settings.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-horaco
backup: true
changes:
  - port.enabled
  - port.vlans
  - vlan.set
fields:
  - key: host
    type: host
    label: Address
    required: true
    help: The switch's IP address (its web interface), e.g. 192.168.1.96
  - key: username
    type: string
    label: Username
    default: admin
    required: true
  - key: password
    type: secret
    label: Password
    required: true
    help: The password of the switch's web interface.
  - key: timeout_s
    type: int
    label: Timeout (seconds)
    default: 15
    group: Advanced
    help: How long to wait for each answer of the switch.
