<html><head><title>VLAN Static</title><link rel="stylesheet" type="text/css" href="/style.css"></head><body><h3>Add VLAN</h3><form method="post" name="vlaneblfrm" action="/vlan.cgi?page=state"><table><tr><td>VLAN Manage:</td><td><input type="checkbox" name="enable_vlan" checked></td><td>? 1.When enable vlan, packets forward by MAC+VLAN;2.When disabled, ALL the vlans will be preserved, packets forward by MAC,and donot touch packets vlan when forward</td></tr></table></form><form method="post" name="formVlanStatic" id="formVlanStatic" action="/vlan.cgi?page=static"><table><tr><td>VLAN ID:</td><td><input type="text" name="vid" id="vlanID"></td><td>(VLAN range：1-4094)</td></tr><tr><td>VLAN Name:</td><td><input type="text" name="name"></td><td>（VLAN Name length:0-14）</td></tr></table><input type="button" value="Apply" onclick="addVlanClick()"></form><form method="post" name="formVlanStatic" action="/vlan.cgi?page=getRmvVlanEntry"><table><tr><th>Select</th><th>No.</th><th>VLAN ID</th><th>VLAN Name</th></tr><tr><td></td><td>1</td><td>1</td><td></td></tr><tr><td><input type="checkbox" class="vlanchk" onclick="delVlanChkBoxClick()"></td><td>2</td><td>10</td><td>Office</td></tr><tr><td><input type="checkbox" class="vlanchk" onclick="delVlanChkBoxClick()"></td><td>3</td><td>20</td><td>Guests</td></tr></table><input type="button" value="Select All"><input type="button" name="Delete" value="Delete"></form></body></html>
